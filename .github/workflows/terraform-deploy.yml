name: Deploy Dream Vacation App

on:
  workflow_dispatch:
  push:
    branches:
      - terra-deploy

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        env:
          TF_VAR_elastic_ip: ${{ secrets.EC2_ELASTIC_IP }}
        run: terraform apply -auto-approve

      - name: Set EC2 Elastic IP
        id: ec2
        run: |
          echo "ec2_ip=${{ secrets.EC2_ELASTIC_IP }}" >> $GITHUB_OUTPUT

    outputs:
      ec2_ip: ${{ steps.ec2.outputs.ec2_ip }}

  deploy:
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/terraform-deploy
          chmod 600 ~/.ssh/terraform-deploy

      - name: Wait for EC2 SSH
        run: |
          for i in {1..30}; do
            if ssh -o StrictHostKeyChecking=no -i ~/.ssh/terraform-deploy ubuntu@${{ needs.terraform.outputs.ec2_ip }} "echo '✅ SSH ready'"; then
              echo "EC2 is ready"
              break
            fi
            echo "Waiting 10s for SSH..."
            sleep 10
          done

      - name: Sync files to EC2
        uses: burnett01/rsync-deployments@5.0
        with:
          switches: -avz --delete
          path: ./
          remote_path: /home/ubuntu/dream-vacation
          remote_host: ${{ needs.terraform.outputs.ec2_ip }}
          remote_user: ubuntu
          remote_key: ${{ secrets.EC2_SSH_KEY }}

      - name: Install Docker, Nginx, and Deploy App
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ needs.terraform.outputs.ec2_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Update system
            sudo apt-get update -y && sudo apt-get upgrade -y

            # Install dependencies
            sudo apt install -y jq ca-certificates curl gnupg lsb-release software-properties-common

            # Docker
            sudo mkdir -p /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list
            sudo apt-get update -y
            sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
            sudo systemctl enable docker && sudo systemctl start docker
            sudo usermod -aG docker ubuntu

            # Nginx
            sudo apt-get install -y nginx certbot python3-certbot-nginx
            sudo systemctl enable nginx && sudo systemctl start nginx
            sudo ufw allow 'Nginx Full'

            # Navigate to app
            cd /home/ubuntu/dream-vacation

            # Stop previous containers
            docker compose down || true
            docker image prune -f || true

            # Pull latest tags
            FRONTEND_SHA=$(curl -s "https://hub.docker.com/v2/repositories/aiyus/dream-frontend/tags?page_size=1&page=1&ordering=last_updated" | jq -r '.results[0].name')
            BACKEND_SHA=$(curl -s "https://hub.docker.com/v2/repositories/aiyus/dream-backend/tags?page_size=1&page=1&ordering=last_updated" | jq -r '.results[0].name')

            # Create .env
            cat <<EOF > .env
            FRONTEND_TAG=${FRONTEND_SHA}
            BACKEND_TAG=${BACKEND_SHA}
            DB_PORT=${{ secrets.DB_PORT }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            EOF

            # Start app
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps