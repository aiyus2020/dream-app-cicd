name: Deploy Dream Vacation App
on:
  workflow_dispatch:
  push:
    branches:
      - terra-deploy

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        env:
          TF_VAR_private_key: ${{ secrets.EC2_SSH_KEY }}
        run: terraform apply -auto-approve

      - name: Get EC2 IP
        id: ec2
        run: |
          EC2_IP=$(terraform output -raw ec2_public_ip)
          echo "ec2_ip=$EC2_IP" >> $GITHUB_OUTPUT

    outputs:
      ec2_ip: ${{ steps.ec2.outputs.ec2_ip }}

  deploy:
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/terraform-deploy
          chmod 600 ~/.ssh/terraform-deploy

      - name: Wait for EC2 SSH
        run: |
          for i in {1..30}; do
            if ssh -o StrictHostKeyChecking=no -i ~/.ssh/terraform-deploy ubuntu@${{ needs.terraform.outputs.ec2_ip }} "echo '✅ SSH ready'"; then
              echo "EC2 is ready"
              break
            fi
            echo "Waiting 10s for SSH..."
            sleep 10
          done

      - name: Sync files to EC2
        uses: burnett01/rsync-deployments@5.0
        with:
          switches: -avz --delete
          path: ./ 
          remote_path: /home/ubuntu/dream-vacation
          remote_host: ${{ needs.terraform.outputs.ec2_ip }}
          remote_user: ubuntu
          remote_key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy Docker on EC2 with Cleanup
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ needs.terraform.outputs.ec2_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/dream-vacation
            docker compose down || true
            docker image prune -f || true

            FRONTEND_SHA=$(curl -s "https://hub.docker.com/v2/repositories/aiyus/dream-frontend/tags?page_size=1&page=1&ordering=last_updated" | jq -r '.results[0].name')
            BACKEND_SHA=$(curl -s "https://hub.docker.com/v2/repositories/aiyus/dream-backend/tags?page_size=1&page=1&ordering=last_updated" | jq -r '.results[0].name')

            cat <<EOF > .env
            FRONTEND_TAG=${FRONTEND_SHA}
            BACKEND_TAG=${BACKEND_SHA}
            DB_PORT=${{ secrets.DB_PORT }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            EOF

            docker compose pull
            docker compose up -d --remove-orphans
