name: Deploy Dream Vacation App

on:
  workflow_dispatch:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync files to EC2
        uses: burnett01/rsync-deployments@5.0
        with:
          switches: -avz --delete --exclude '.git/' --exclude 'node_modules/' --exclude '.github/' --exclude '*.log'
          path: ./
          remote_path: /home/ubuntu/dream-vacation
          remote_host: ${{ secrets.EC2_HOST }}
          remote_user: ubuntu
          remote_key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ubuntu/dream-vacation
            cd /home/ubuntu/dream-vacation

            # Create .env file
            cat <<EOF > .env
FRONTEND_TAG=${GITHUB_SHA}
BACKEND_TAG=${GITHUB_SHA}
DB_PORT=${{ secrets.DB_PORT }}
POSTGRES_DB=${{ secrets.POSTGRES_DB }}
POSTGRES_USER=${{ secrets.POSTGRES_USER }}
POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
EOF

            # Pull SHA-tagged images and start containers
            docker-compose pull
            docker-compose up -d
