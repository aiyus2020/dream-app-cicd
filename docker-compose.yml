services:
  frontend:
    image: aiyus/dream-frontend:${FRONTEND_TAG}
    expose:
      - "80"
    networks:
      - vacation-net

  backend:
    image: aiyus/dream-backend:${BACKEND_TAG}
    expose:
      - "5000"
    env_file: .env
    networks:
      - vacation-net

  db:
    image: postgres:14
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file: .env
    networks:
      - vacation-net

  nginx_proxy:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
    networks:
      - vacation-net

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: >
      sh -c "certbot certonly --webroot
      --webroot-path=/var/www/certbot
      -d aiyusdreamapp.name.ng
      -d www.aiyusdreamapp.name.ng
      --email aiyusboss@gmail.com
      --agree-tos --non-interactive --staging || true"

volumes:
  pgdata:

networks:
  vacation-net:
    driver: bridge
