# Redirect HTTP -> HTTPS, but still allow certbot challenges
server {
    listen 80;
    server_name aiyusdreamapp.name.ng www.aiyusdreamapp.name.ng;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;   # certbot challenge path
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    server_name aiyusdreamapp.name.ng www.aiyusdreamapp.name.ng;

    # SSL certificates from certbot
    ssl_certificate /etc/letsencrypt/live/aiyusdreamapp.name.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aiyusdreamapp.name.ng/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Proxy frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy backend API
    location /api/ {
        proxy_pass http://backend:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
