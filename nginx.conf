server {
    listen 80;
    server_name aiyusdreamapp.name.ng www.aiyusdreamapp.name.ng;

    # Let’s Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS after SSL is ready
    location / {
        proxy_pass http://frontend:3000;  # or backend if that’s your API
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name aiyusdreamapp.name.ng www.aiyusdreamapp.name.ng;

    ssl_certificate /etc/letsencrypt/live/aiyusdreamapp.name.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aiyusdreamapp.name.ng/privkey.pem;

    location / {
        proxy_pass http://frontend:3000;  # or backend if needed
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
